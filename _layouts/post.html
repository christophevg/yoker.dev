---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.author %} — {{ page.author }}{% endif %}</div>
    {% if page.tags %}
    <div class="post-tags">
      {% for tag in page.tags %}
      <span>{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
  </header>

  {% if page.image %}
  <img class="post-hero" src="{{ page.image | relative_url }}" alt="{{ page.title }}">
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>

  <a href="{{ '/blog/' | relative_url }}" class="back-to-blog">&larr; Back to blog</a>
</article>
