[plugins]
enabled = true
packages = ["yoker_writing_assistant"]

[plugins.trusted]
yoker_writing_assistant = true

[permissions]
filesystem_paths = [".", "~/VOICE.md"]
blocked_write_paths = [ "~/VOICE.md" ]

[context]
storage_path = "./local/context"

[agents.directories]
c3 = "../c3/agents"

[skills]
discovery = true

[skills.directories]
c3 = "../c3/skills"

[tools.github]
allowed_operations = [
  "repo_view", "issue_list", "issue_view", "pr_list", "pr_view",
  "pr_reviews", "pr_comments",
  "workflow_list", "workflow_view", "workflow_logs",
  "release_list", "release_view",
  "pr_create", "release_create"
]

[tools.git]
enabled = true
auto_permission = ["status", "log", "diff", "branch", "show", "commit", "add", "checkout"]
